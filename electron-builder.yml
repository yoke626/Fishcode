appId: com.fishcode.app
productName: Fishcode
asar: true
npmRebuild: false

# Update feed for electron-updater. The generic provider points straight at the
# GitHub "latest release" asset root (no api.github.com dependency — better for
# users in mainland China where the API is often blocked / rate-limited).
# electron-builder emits resources/app-update.yml from this; electron-builder
# also generates latest.yml / latest-mac.yml / latest-linux.yml + *.blockmap
# next to the installers, which CI must upload to the release (see release.yml).
publish:
  provider: generic
  url: https://github.com/yoke626/Fishcode/releases/latest/download/

directories:
  output: release

# Only the compiled app is packaged into app.asar. The standalone Node runtime
# cannot read asar, so node-runtime, the dsh dependency tree, and the bundled
# skills all ship OUTSIDE asar via extraResources (resources/).
files:
  - out/**/*

extraResources:
  - from: node-runtime
    to: node-runtime
  - from: dsh-bundle/node_modules
    to: dsh/node_modules
  - from: out/skills
    to: skills
  # Session lookup/deletion helper for the dsh sidebar three-dot delete. It runs
  # under the bundled standalone Node (needs node:zstd, absent from Electron's
  # Node 20), so it must live OUTSIDE asar.
  - from: scripts/session-helper.mjs
    to: session-helper.mjs

win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # build/installer.nsh: bust the Windows icon cache after install so the
  # desktop shortcut shows the new icon instead of a stale cached one.
  include: build/installer.nsh

# Arch is chosen per-run (current arch by default; CI matrix drives x64/arm64)
# so the fetched standalone Node runtime always matches the package it ships in.
mac:
  target:
    - dmg
  icon: build/icon.png
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Development
